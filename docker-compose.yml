version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fog-iq-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - FOGIQ_AWS_ENABLED=false
    volumes:
      - ./data:/app/data
      - ./ml/registry:/app/ml/registry
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fog-iq-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

